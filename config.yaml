# Shopify store feed configuration
# IMPORTANT: Don't commit credentials to git!
# Use environment variables or GitHub Secrets for Actions
#
# As of January 2026, Shopify requires OAuth client credentials.
# Get these from your app in the Shopify Partners dashboard.

# GitHub Pages base URL for feed hosting
github_pages_url: https://bisgaardshoes.github.io/feed-manager

# Product-level hard cap on ad exposure: a product is only advertised
# (availability: in stock / preorder) if at least this many of its variants
# (sizes) are actually sellable. Below that, ALL of its variants report
# "out of stock" in the feed, so it stops showing in Shopping/Meta ads.
# Products with fewer total variants than this threshold are exempt and use
# normal per-variant availability (covers single-variant items like some
# care products). Tune this based on observed Shopping conversion rate.
min_sizes_in_stock: 3

# Shopify app credentials (shared across all stores)
client_id: ${SHOPIFY_CLIENT_ID}
client_secret: ${SHOPIFY_CLIENT_SECRET}

stores:
  - name: FR
    display_name: France
    shop_domain: bisgaardshoes-fr.myshopify.com
    customer_domain: bisgaard.fr
    language: fr
    currency: EUR
  - name: EN
    display_name: English
    shop_domain: bisgaardshoes-en.myshopify.com
    customer_domain: bisgaardshoes.com
    language: en
    currency: EUR
  - name: DK
    display_name: Denmark
    shop_domain: bisgaardshoes-dk.myshopify.com
    customer_domain: bisgaardshoes.dk
    language: da
    currency: DKK
  - name: DE
    display_name: Germany
    shop_domain: bisgaardshoes-de.myshopify.com
    customer_domain: bisgaardshoes.de
    language: de
    currency: EUR
  - name: NL
    display_name: Netherlands
    shop_domain: bisgaard-nl.myshopify.com
    customer_domain: bisgaardschoenen.nl
    language: nl
    currency: EUR